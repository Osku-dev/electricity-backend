spring.application.name=electricity-backend

DAILY_PRICES_URL=http://localhost/mock-daily
HOURLY_PRICE_URL=http://localhost/mock-hourly

FRONTEND_URL=http://localhost:3000

# Testcontainers will override these dynamically,
# but Spring still likes having defaults present
spring.datasource.url=jdbc:postgresql://localhost:5432/testdb
spring.datasource.username=test
spring.datasource.password=test

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect